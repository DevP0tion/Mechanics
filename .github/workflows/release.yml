# Builds the mod jar and publishes a GitHub release, started in one of two ways:
#   - pushing a version tag (v*): the release is made for that tag;
#   - running the workflow by hand (Actions tab > Release > Run workflow) on a branch with a tag
#     name such as v0.1.0: the release and its tag are created on that branch's latest commit.
#     The run fails if the tag already exists.
#
# Release notes: each release needs its own notes file, .github/release-notes/<tag>.md
# (for example .github/release-notes/v0.1.0.md). The run fails if the file is missing.
#
# Pre-release: a release is marked as a pre-release only when its notes file contains the
# marker line
#     <!-- prerelease -->
# (an HTML comment, so it does not show in the rendered notes). Each release states its own
# pre-release choice in its notes file; this workflow encodes no policy about which versions
# are pre-releases.
#
# The build compiles against the official Necesse dedicated server package for the game version
# in build.gradle (gameVersion). The jar's mod.info version must equal the tag without its
# leading "v", or the run fails before anything is published.
#
# Steam Workshop: a run started by hand with "steam_publish" ticked also uploads the release's
# jar to the Steam Workshop item, in the job "workshop" after the release job, through the
# reusable workflow workshop-upload.yml (its header lists what an upload changes and the
# one-time setup; step-by-step guide in Korean: docs/steam-workshop.md). Runs started by a pushed
# tag never upload. Before building, such a run checks that it is on the default branch, that the
# repository variable WORKSHOP_ITEM_ID is set, and that the Workshop title, description and the
# English change note exist and fit Steam's limits, so a run that cannot upload fails before the
# release is published. To upload an existing release again, run Workshop re-upload
# (workshop-reupload.yml).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create for the release, for example v0.1.0"
        required: true
        type: string
      steam_publish:
        description: "Also upload to the Steam Workshop (default branch only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Necesse 1.3.3 dedicated server (Linux). The bare S3 URL is refused (403); the download page
  # hands out short-lived signed links to the same file, so the link is taken from that page.
  SERVER_URL: https://necesse-website.s3.eu-central-1.amazonaws.com/server/1-3-3-24926468/necesse-server-linux64-1-3-3-24926468.zip
  SERVER_PAGE: https://necessegame.com/server
  SERVER_SHA256: 8ba1abdbae6ac57e7ba33e56389e18717f78d9e46aaebae30cd50dfa5c4d697c
  SERVER_DIR: necesse-server-1-3-3-24926468
  # The release tag: the typed input of a manual run, else the pushed tag.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # The same pin as workshop-upload.yml; change both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag of a manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Tag '$TAG' is not of the form v<version>, for example v0.1.0"
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists; push it or choose another"
            exit 1
          fi

      - name: Check the release notes file
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing release notes file $notes"
            exit 1
          fi
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      # Only with steam_publish (empty, so false, on tag pushes). The same checks as the upload.
      - name: Check the Steam Workshop upload settings
        if: inputs.steam_publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ITEM_ID: ${{ vars.WORKSHOP_ITEM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::steam_publish needs a run on the default branch ($DEFAULT_BRANCH), not on $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$ITEM_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::Set the repository variable WORKSHOP_ITEM_ID to the numeric Workshop item ID (now '$ITEM_ID')"
            exit 1
          fi
          python3 -I tools/workshop/md_to_bbcode.py "$NOTES_FILE" -o "$RUNNER_TEMP/changenote.bbcode"
          python3 -I tools/workshop/write_vdf.py --check-only \
            --title-file .github/workshop/title.txt \
            --description-file .github/workshop/description.bbcode \
            --changenote-file "$RUNNER_TEMP/changenote.bbcode"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      - name: Download the Necesse dedicated server
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/necesse"
          mkdir -p "$dir"
          cd "$dir"
          if ! curl -fsSL --retry 3 -o server.zip "$SERVER_URL"; then
            echo "Direct download refused; taking the signed link from $SERVER_PAGE"
            pattern="$(printf '%s' "$SERVER_URL" | sed 's/[.]/\\./g')?[^\"' <>]*"
            link="$(curl -fsSL --retry 3 "$SERVER_PAGE" | grep -o "$pattern" | head -n 1 | sed 's/&amp;/\&/g' || true)"
            if [ -z "$link" ]; then
              echo "::error::No download link for $SERVER_URL on $SERVER_PAGE"
              exit 1
            fi
            curl -fsSL --retry 3 -o server.zip "$link"
          fi
          echo "$SERVER_SHA256  server.zip" | sha256sum -c -
          unzip -q server.zip
          test -f "$SERVER_DIR/Server.jar"
          echo "GAME_DIR=$dir/$SERVER_DIR" >> "$GITHUB_ENV"

      - name: Build and test
        run: gradle --no-daemon -PgameDir="$GAME_DIR" clean buildModJar check

      - name: Check the mod version against the tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          jars=(build/jar/*.jar)
          if [ "${#jars[@]}" -ne 1 ] || [ ! -f "${jars[0]}" ]; then
            echo "::error::Expected exactly one jar in build/jar, found: ${jars[*]}"
            exit 1
          fi
          mod_version="$(unzip -p "${jars[0]}" mod.info | tr -d '\r' \
            | sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*\([^,]*\),\{0,1\}[[:space:]]*$/\1/p')"
          echo "Tag $TAG, jar ${jars[0]}, mod.info version '$mod_version'"
          if [ "$mod_version" != "$version" ]; then
            echo "::error::mod.info version '$mod_version' does not match the tag version '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          if grep -Eq '^[[:space:]]*<!-- prerelease -->[[:space:]]*$' "$NOTES_FILE"; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" build/jar/*.jar \
            --target "$GITHUB_SHA" \
            --title "Mechanics $VERSION" \
            --notes-file "$NOTES_FILE" \
            ${prerelease[@]+"${prerelease[@]}"}

  # Steam Workshop upload of this release: only for a run started by hand with steam_publish
  # ticked, and only after the release job succeeded. The Steam secrets are environment secrets of
  # "steam-workshop"; GitHub requires the caller to pass them by name to the reusable workflow.
  workshop:
    needs: release
    if: inputs.steam_publish
    permissions:
      contents: read
    uses: ./.github/workflows/workshop-upload.yml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}
