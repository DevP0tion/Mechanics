# Builds the mod jar and publishes a GitHub release when a version tag (v*) is pushed.
#
# Release notes: each release needs its own notes file, .github/release-notes/<tag>.md
# (for example .github/release-notes/v0.1.0.md). The run fails if the file is missing.
#
# Pre-release: a release is marked as a pre-release only when its notes file contains the
# marker line
#     <!-- prerelease -->
# (an HTML comment, so it does not show in the rendered notes). Each release states its own
# pre-release choice in its notes file; this workflow encodes no policy about which versions
# are pre-releases.
#
# The build compiles against the official Necesse dedicated server package for the game version
# in build.gradle (gameVersion). The jar's mod.info version must equal the tag without its
# leading "v", or the run fails before anything is published.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Necesse 1.3.3 dedicated server (Linux). The bare S3 URL is refused (403); the download page
  # hands out short-lived signed links to the same file, so the link is taken from that page.
  SERVER_URL: https://necesse-website.s3.eu-central-1.amazonaws.com/server/1-3-3-24926468/necesse-server-linux64-1-3-3-24926468.zip
  SERVER_PAGE: https://necessegame.com/server
  SERVER_SHA256: 8ba1abdbae6ac57e7ba33e56389e18717f78d9e46aaebae30cd50dfa5c4d697c
  SERVER_DIR: necesse-server-1-3-3-24926468

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the release notes file
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing release notes file $notes"
            exit 1
          fi
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Download the Necesse dedicated server
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/necesse"
          mkdir -p "$dir"
          cd "$dir"
          if ! curl -fsSL --retry 3 -o server.zip "$SERVER_URL"; then
            echo "Direct download refused; taking the signed link from $SERVER_PAGE"
            pattern="$(printf '%s' "$SERVER_URL" | sed 's/[.]/\\./g')?[^\"' <>]*"
            link="$(curl -fsSL --retry 3 "$SERVER_PAGE" | grep -o "$pattern" | head -n 1 | sed 's/&amp;/\&/g' || true)"
            if [ -z "$link" ]; then
              echo "::error::No download link for $SERVER_URL on $SERVER_PAGE"
              exit 1
            fi
            curl -fsSL --retry 3 -o server.zip "$link"
          fi
          echo "$SERVER_SHA256  server.zip" | sha256sum -c -
          unzip -q server.zip
          test -f "$SERVER_DIR/Server.jar"
          echo "GAME_DIR=$dir/$SERVER_DIR" >> "$GITHUB_ENV"

      - name: Build and test
        run: gradle --no-daemon -PgameDir="$GAME_DIR" clean buildModJar check

      - name: Check the mod version against the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jars=(build/jar/*.jar)
          if [ "${#jars[@]}" -ne 1 ] || [ ! -f "${jars[0]}" ]; then
            echo "::error::Expected exactly one jar in build/jar, found: ${jars[*]}"
            exit 1
          fi
          mod_version="$(unzip -p "${jars[0]}" mod.info | tr -d '\r' \
            | sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*\([^,]*\),\{0,1\}[[:space:]]*$/\1/p')"
          echo "Tag $GITHUB_REF_NAME, jar ${jars[0]}, mod.info version '$mod_version'"
          if [ "$mod_version" != "$version" ]; then
            echo "::error::mod.info version '$mod_version' does not match the tag version '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          if grep -Eq '^[[:space:]]*<!-- prerelease -->[[:space:]]*$' "$NOTES_FILE"; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" build/jar/*.jar \
            --title "Mechanics $VERSION" \
            --notes-file "$NOTES_FILE" \
            ${prerelease[@]+"${prerelease[@]}"}
